    <rect x="6" y="6" width="52" height="40" rx="4" fill="#1b5e3f"/>
  </g>
  <text x="32" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" letter-spacing="1.4" fill="#fff">LAND</text>
  <text x="32" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" letter-spacing="1.4" fill="#fff">ROVER</text>
</svg>
